# 地理（7～8 年级）知识点库
# 依据义务教育课程标准（2022 年版）生成，未经教师审核，待试用反馈修订
# 版本：2026-10-22
# 结构：领域 → 主题 → 知识点；叶子的 grade_band 为常见教材讲授该内容的年级。
# 改名或删点后重新导入：python -m app.knowledge.loader --prune data/knowledge/*.yaml
