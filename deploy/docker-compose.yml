# Production stack for one small server (2 cores / 2 GB). Secrets come from deploy/.env on the server.
name: mistake-book

x-backend: &backend
  build: ../backend
  image: mistake-book-backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/cuotiben
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    STORAGE_DIR: /app/storage
    TZ: Asia/Shanghai
  volumes:
    - storage:/app/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cuotiben
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/small.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "64mb"]
    volumes:
      - redis:/data

  api:
    <<: *backend

  worker:
    <<: *backend
    command: ["arq", "app.jobs.worker.WorkerSettings"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv/web:ro
    depends_on:
      - api

volumes:
  mysql:
  redis:
  storage:
