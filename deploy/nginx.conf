# HTTP only until the domain's ICP filing is done; HTTPS (443) gets added then.
server {
    listen 80 default_server;
    server_name _;

    # Phone photos are compressed to <= 2000px JPEG, but leave room.
    client_max_body_size 20m;

    # Resolve the api container per request via Docker's DNS: its IP changes when it is recreated.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Proxy settings shared by the API locations below (inherited: those locations set no proxy_set_header).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answer-key extraction waits on the model (up to ~2 minutes with retries).
    proxy_read_timeout 180s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $api;
    }

    location = /healthz {
        proxy_pass $api;
    }

    # Web admin (Vite build mounted at /srv/web). Hashed asset names never change: cache for a year.
    location /assets/ {
        root /srv/web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page must always be revalidated so a new deploy is picked up.
    location = /index.html {
        root /srv/web;
        add_header Cache-Control "no-cache";
    }

    # Front-end routes (/login, /a/1, ...) fall back to index.html.
    location / {
        root /srv/web;
        try_files $uri /index.html;
    }
}
